[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pdf-perceptual-compare"
version = "1.0.0"
description = "Compare PDF pages visually using perceptual metrics."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Frédéric BISSON", email = "zigazou@protonmail.com" }]
dependencies = [
  "numpy>=1.24",
  "Pillow>=10.0",
  "python-poppler>=0.4.1",
  "scikit-image>=0.21",
]

[project.scripts]
pdf-perceptual-compare = "pdf_perceptual_compare.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "ruff>=0.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
